<!-- Secção do Painel Administrativo para Cadastro de Novos Produtos -->
<div class="card shadow-sm p-4 mb-5 bg-white border-success">
    <h3 class="h5 text-success fw-bold mb-3">Painel de Controlo: Registar Novo Produto na Safra</h3>
    <form id="form-novo-produto" onsubmit="adicionarNovoProduto(event)">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Nome do Produto</label>
                <input type="text" id="prod-nome" class="form-control" required placeholder="Ex: Cupuaçu Selecionado">
            </div>
            <div class="col-md-4">
                <label class="form-label">Produtor / Origem</label>
                <input type="text" id="prod-origem" class="form-control" required placeholder="Ex: Sítio Boa Vista">
            </div>
            <div class="col-md-4">
                <label class="form-label">Preço (R$)</label>
                <input type="number" step="0.01" id="prod-preco" class="form-control" required placeholder="15.00">
            </div>
            <div class="col-12">
                <label class="form-label">URL da Imagem ou Ficheiro</label>
                <input type="text" id="prod-img" class="form-control" required placeholder="cupuacu.jpg">
            </div>
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-success px-4">Publicar Produto no Catálogo</button>
            </div>
        </div>
    </form>
</div>

<script>
function adicionarNovoProduto(event) {
    event.preventDefault();
    const novoProduto = {
        id: 'prod_' + Date.now(),
        nome: document.getElementById('prod-nome').value,
        origem: document.getElementById('prod-origem').value,
        preco: parseFloat(document.getElementById('prod-preco').value),
        imagem: document.getElementById('prod-img').value
    };

    let catalogo = JSON.parse(localStorage.getItem('agrofeira_produtos')) || [];
    catalogo.push(novoProduto);
    localStorage.setItem('agrofeira_produtos', JSON.stringify(catalogo));

    alert('Produto registado e publicado com sucesso no catálogo!');
    document.getElementById('form-novo-produto').reset();
}
</script>
