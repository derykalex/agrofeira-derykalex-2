<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel do Produtor - AgroFeira</title>
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container py-5">
      <header class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-success mb-1">Painel Administrativo da Safra</h1>
          <p class="text-muted mb-0">Gestão de produtos da agricultura familiar de Paragominas</p>
        </div>
        <a href="catalogo-bootstrap.html" class="btn btn-outline-success">Ver Catálogo Público →</a>
      </header>

      <!-- Formulário para Registar Novo Produto -->
      <div class="card shadow-sm p-4 mb-5 bg-white border-success">
        <h3 class="h5 text-success fw-bold mb-3">➕ Registar Novo Produto na Safra</h3>
        <form onsubmit="cadastrarProdutoAdmin(event)">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Nome do Produto</label>
              <input type="text" id="admin-nome" class="form-control" required placeholder="Ex: Mel Silvestre">
            </div>
            <div class="col-md-4">
              <label class="form-label">Produtor / Origem</label>
              <input type="text" id="admin-origem" class="form-control" required placeholder="Ex: Colônia do Uraim">
            </div>
            <div class="col-md-4">
              <label class="form-label">Preço (R$)</label>
              <input type="number" step="0.01" id="admin-preco" class="form-control" required placeholder="25.00">
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-success px-4">Salvar e Publicar na Safra</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Lista de Produtos Registados -->
      <div class="card shadow-sm p-4 bg-white">
        <h3 class="h5 text-secondary fw-bold mb-3">📦 Produtos Atualmente em Catálogo</h3>
        <div class="table-responsive">
          <table class="table table-bordered table-striped align-middle">
            <thead class="table-success">
              <tr>
                <th>Produto</th>
                <th>Origem / Produtor</th>
                <th>Preço</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-produtos-admin">
              <!-- Injetado via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      function carregarProdutosAdmin() {
        // Produtos padrão + adicionados
        const tbody = document.getElementById('tabela-produtos-admin');
        const produtosPadrao = [
          {id: 'acai', nome: 'Açaí médio', origem: 'Sítio Boa Vista', preco: 12.00},
          {id: 'farinha', nome: 'Farinha d\'água', origem: 'Casa de Farinha São José', preco: 90.00},
          {id: 'banana', nome: 'Banana-prata', origem: 'Sítio Três Irmãos', preco: 8.00}
        ];
        
        tbody.innerHTML = produtosPadrao.map(p => `
          <tr>
            <td><strong>${p.nome}</strong></td>
            <td>${p.origem}</td>
            <td>R$ ${p.preco.toFixed(2)}</td>
            <td><span class="badge bg-secondary">Ativo</span></td>
          </tr>
        `).join('');
      }

      function cadastrarProdutoAdmin(event) {
        event.preventDefault();
        const nome = document.getElementById('admin-nome').value;
        const origem = document.getElementById('admin-origem').value;
        const preco = parseFloat(document.getElementById('admin-preco').value);

        alert(`Sucesso! O produto "${nome}" da origem "${origem}" (R$ ${preco.toFixed(2)}) foi registado no sistema.`);
        document.querySelector('form').reset();
        carregarProdutosAdmin();
      }

      document.addEventListener('DOMContentLoaded', carregarProdutosAdmin);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
